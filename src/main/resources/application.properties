spring.application.name=PratoshOrchestrationPaymentPlatform

# Optional local .env file (KEY=VALUE per line). Never commit it.
spring.config.import=optional:file:./.env[.properties]

# Server
server.port=8080

# MySQL (no default password on purpose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payflow_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Secrets: required, supplied through environment variables or .env
jwt.secret=
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
credential.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:}

# Initial administrator (created only if the username does not exist)
admin.username=${ADMIN_USERNAME:}
admin.email=${ADMIN_EMAIL: }
admin.password=${ADMIN_PASSWORD:}

# Payment orchestration
payment.routing.environment=${PAYMENT_ENVIRONMENT:SANDBOX}
payment.gateway.mode=MOCK
# Create and run the first attempt as soon as a payment is created
payment.auto-process=${PAYMENT_AUTO_PROCESS:true}

# Retry
payment.retry.enabled=true
payment.retry.max-attempts=3
payment.retry.delay-ms=2000
payment.retry.scan-interval-ms=5000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.pratosh.orchestration=INFO
